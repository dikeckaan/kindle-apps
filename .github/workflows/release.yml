name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch dependencies
        run: ./tools/fetch-deps.sh
      # Tarifler online library (dist/tarif/v1, ~4 MB of recipe shards from Wikibooks) is built here, not kept in git.
      # The cache keeps the page texts by revision, so a run only fetches pages edited since the last one; when the
      # Wikibooks API cannot be reached the previous run's library (restored with the cache) is published again.
      - name: Restore the Tarifler library cache
        uses: actions/cache@v4
        with:
          path: |
            build/tarif-cache
            build/tarif-lib
          key: tarif-lib-${{ github.run_id }}
          restore-keys: tarif-lib-
      - name: Tarifler online library
        run: |
          make tarif-lib || { echo "::warning::build-shards.py failed, publishing the cached library"; test -f build/tarif-lib/v1/index.tsv; }
          cat build/tarif-lib/v1/manifest.txt
      - name: Host unit tests
        run: make test
      - name: Translation catalogs
        run: python3 tools/i18n/extract.py --check
      - name: Build toolchain image
        run: docker build -t kindle-apps-tc tools/docker
      - name: Cross build
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src kindle-apps-tc make cross
      - name: Package
        run: make dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Kurulum için README'ye bakın." \
            dist/packages/*/*.kpkg dist/kindle-apps-depo.sh || \
          gh release upload "$GITHUB_REF_NAME" dist/packages/*/*.kpkg dist/kindle-apps-depo.sh --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
